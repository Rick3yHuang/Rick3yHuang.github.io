<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Candidate orbital planes for initial orbit determination</title>
  <desc id="desc">Two intersecting candidate orbital planes. The origin lies at a focus of the gray plane, while a focus of the red candidate plane does not coincide with the origin.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#314a5d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8323b"/>
    </marker>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0d2433" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Candidate planes -->
  <ellipse cx="426" cy="302" rx="382" ry="118" fill="#aeb9bf" fill-opacity=".27" stroke="#536977" stroke-width="3"/>
  <ellipse cx="415" cy="305" rx="308" ry="178" transform="rotate(-18 415 305)" fill="#e9a4a8" fill-opacity=".30" stroke="#c8323b" stroke-width="3"/>

  <!-- Construction lines and sampled points -->
  <g fill="none" stroke="#60737f" stroke-width="1.6" stroke-linecap="round">
    <line x1="102" y1="188" x2="132" y2="435"/>
    <line x1="328" y1="52" x2="190" y2="280"/>
    <line x1="442" y1="24" x2="393" y2="285"/>
    <line x1="564" y1="91" x2="530" y2="325"/>
    <line x1="623" y1="473" x2="335" y2="268"/>
  </g>
  <g fill="#263d4c">
    <circle cx="102" cy="188" r="5"/><circle cx="328" cy="52" r="5"/><circle cx="442" cy="24" r="5"/>
    <circle cx="564" cy="91" r="5"/><circle cx="623" cy="473" r="5"/>
  </g>

  <!-- Foci and origin -->
  <circle cx="178" cy="302" r="10" fill="#5d5052"/>
  <!-- The two red foci are symmetric about the center of the red ellipse
       and lie along its rotated major axis. -->
  <circle cx="260" cy="355" r="11" fill="#d71920"/>
  <circle cx="570" cy="255" r="11" fill="#c8323b"/>
  <g transform="translate(674 302)">
    <circle r="44" fill="#6e7d9c" fill-opacity=".48"/>
    <path d="M-36 -9 C-22 -23 -10 -21 1 -31 C13 -17 14 -8 30 -5 C22 7 12 9 9 23 C-5 17 -13 6 -27 10 Z" fill="#b5bb83" fill-opacity=".82"/>
    <path d="M-8 -42 C0 -30 1 -19 16 -14 C7 -7 -4 -8 -12 0 C-19 -11 -20 -26 -8 -42 Z" fill="#b5bb83" fill-opacity=".72"/>
    <circle r="12" fill="#283648"/>
  </g>
  <text x="716" y="338" fill="#263d4c" font-family="system-ui, sans-serif" font-size="22">(0,0,0)</text>

  <!-- Origin annotation -->
  <path d="M748 155 C748 225 724 274 674 302" fill="none" stroke="#314a5d" stroke-width="4" marker-end="url(#arrow-slate)"/>
  <g filter="url(#soft-shadow)">
    <rect x="628" y="34" width="240" height="120" rx="18" fill="#fbfdff" stroke="#314a5d" stroke-width="3"/>
    <text x="748" y="83" text-anchor="middle" fill="#172f40" font-family="system-ui, sans-serif" font-size="29">
      <tspan x="748">Origin is one</tspan><tspan x="748" dy="38">of the foci</tspan>
    </text>
  </g>

  <!-- Alternate-focus annotation -->
  <path d="M346 526 C293 501 252 466 251 415 C251 390 255 369 259 357" fill="none" stroke="#c8323b" stroke-width="4" marker-end="url(#arrow-red)"/>
  <g filter="url(#soft-shadow)">
    <rect x="198" y="526" width="310" height="105" rx="18" fill="#fbfdff" stroke="#c8323b" stroke-width="3"/>
    <text x="353" y="570" text-anchor="middle" fill="#c01620" font-family="system-ui, sans-serif" font-size="27">
      <tspan x="353">Foci are not at</tspan><tspan x="353" dy="36">the origin</tspan>
    </text>
  </g>
</svg>
