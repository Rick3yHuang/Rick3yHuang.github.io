<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" href="{{ '/assets/images/branding/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/branding/favicon-32.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/branding/apple-touch-icon.png' | relative_url }}">
    <script>
      (() => {
        const savedTheme = localStorage.getItem("theme");
        const theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    {% assign primary_nav_open = 'true' %}
    {% if page.url == '/teaching/math-1553/' %}
      {% assign primary_nav_open = 'false' %}
    {% endif %}
    <header class="site-header">
      <div class="site-header__identity">
        <a class="site-name" href="{{ '/' | relative_url }}">Rickey Huang</a>
        <button class="site-nav-toggle" type="button" aria-controls="primary-navigation" aria-expanded="{{ primary_nav_open }}" aria-label="{% if page.url == '/teaching/math-1553/' %}Show navigation{% else %}Hide navigation{% endif %}" title="{% if page.url == '/teaching/math-1553/' %}Show navigation{% else %}Hide navigation{% endif %}">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m9 6 6 6-6 6"/>
          </svg>
        </button>
      </div>
      <nav id="primary-navigation" class="site-nav" aria-label="Primary navigation"{% if page.url == '/teaching/math-1553/' %} hidden{% endif %}>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#education">Education</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/' | relative_url }}#activities">Activities</a>
        <a href="{{ '/' | relative_url }}#teaching">Teaching</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch color theme">
        <svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.4 15.5A8.4 8.4 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/></svg>
        <svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      </button>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>© 2026 Ruiqi Huang <span aria-hidden="true">·</span> Last updated August 2026</p>
    </footer>
    <div class="copy-toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
